[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
env =
    DATABASE_URL=sqlite+aiosqlite:///:memory:
    ENVIRONMENT=test
    WRAP_MASTER_KEY=test_master_key_minimum_32_characters_long_12345
    WRAP_API_KEYS=wrap_test_api_key_minimum_16_chars_12345


