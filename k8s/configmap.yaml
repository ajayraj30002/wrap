apiVersion: v1
kind: ConfigMap
metadata:
  name: wrap-config
  namespace: wrap
  labels:
    app.kubernetes.io/name: wrap
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: '["*"]'
  DAG_MAX_NODES: "12"
  DAG_MAX_PARALLEL_NODES: "6"
  DATABASE_URL: "postgresql+asyncpg://wrap:wrap@wrap-postgres:5432/wrap"
