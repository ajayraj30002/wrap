# Kubernetes Secrets Template
# Replace these values with secure, base64/sealed secret values in production!
apiVersion: v1
kind: Secret
metadata:
  name: wrap-secrets
  namespace: wrap
  labels:
    app.kubernetes.io/name: wrap
type: Opaque
stringData:
  WRAP_MASTER_KEY: "change-this-to-a-secure-32-char-random-key"
  WRAP_API_KEYS: "wrap_change_this_to_a_secure_token"
  POSTGRES_USER: "wrap"
  POSTGRES_PASSWORD: "change-this-secure-postgres-password"
  POSTGRES_DB: "wrap"
