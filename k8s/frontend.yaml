apiVersion: v1
kind: Service
metadata:
  name: wrap-frontend
  namespace: wrap
  labels:
    app.kubernetes.io/name: wrap-frontend
    app.kubernetes.io/part-of: wrap-ai-gateway
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: wrap-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrap-frontend
  namespace: wrap
  labels:
    app.kubernetes.io/name: wrap-frontend
    app.kubernetes.io/part-of: wrap-ai-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wrap-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wrap-frontend
    spec:
      containers:
        - name: frontend
          image: wrap-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
